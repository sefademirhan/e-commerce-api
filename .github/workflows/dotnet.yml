name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore API
        run: dotnet restore src/ECommerceApi/ECommerceApi.csproj
      - name: Build API
        run: dotnet build src/ECommerceApi/ECommerceApi.csproj -c Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/ECommerceApi.Tests/ECommerceApi.Tests.csproj
      - name: Run SQLite-backed checkout tests
        run: dotnet test tests/ECommerceApi.Tests/ECommerceApi.Tests.csproj -c Release --no-restore
