name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore API
        run: dotnet restore src/ECommerceApi/ECommerceApi.csproj
      - name: Build API
        run: dotnet build src/ECommerceApi/ECommerceApi.csproj -c Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/ECommerceApi.Tests/ECommerceApi.Tests.csproj
      - name: Run SQLite-backed checkout tests
        run: dotnet test tests/ECommerceApi.Tests/ECommerceApi.Tests.csproj -c Release --no-restore

      - name: Restore project-local Entity Framework tool
        run: dotnet tool restore
      - name: Verify migration discovery and SQL generation
        run: |
          dotnet tool run dotnet-ef migrations list --project src/ECommerceApi/ECommerceApi.csproj --no-connect > migrations.txt
          cat migrations.txt
          grep -q "AddCartAndOrders" migrations.txt
          dotnet tool run dotnet-ef migrations script --project src/ECommerceApi/ECommerceApi.csproj --idempotent --output migrations.sql
          test -s migrations.sql
